<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFP Story Studio - Stage 1</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #07111f;
    font-family: "Vazirmatn", sans-serif;
}
#root {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, #17365b 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, #153d45 0%, transparent 38%),
        linear-gradient(145deg, #07111f, #101d32 55%, #07111f);
}
.scene {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    opacity: 0;
    visibility: hidden;
    overflow: hidden;
}
.scene::before {
    content: "";
    position: absolute;
    width: 850px;
    height: 850px;
    border: 2px solid rgba(80, 190, 255, 0.12);
    border-radius: 50%;
    top: 350px;
    left: 115px;
}
.scene::after {
    content: "";
    position: absolute;
    width: 620px;
    height: 620px;
    border: 2px solid rgba(80, 190, 255, 0.10);
    border-radius: 50%;
    top: 465px;
    left: 230px;
}
.scene-number {
    position: absolute;
    top: 130px;
    right: 90px;
    color: rgba(255,255,255,0.12);
    font-size: 150px;
    font-weight: 800;
}
.node {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #48c6ef;
    box-shadow:
        0 0 20px rgba(72,198,239,0.8),
        0 0 55px rgba(72,198,239,0.35);
    z-index: 3;
}
.stage1-node-1 {
    background: #f6bd60;
    box-shadow: 0 0 25px rgba(246,189,96,0.7);
}
.stage1-node-2 {
    background: #80ed99;
    box-shadow: 0 0 25px rgba(128,237,153,0.7);
}
.caption-area {
    position: absolute;
    left: 70px;
    right: 70px;
    bottom: 230px;
    min-height: 230px;
    padding: 42px 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 13, 26, 0.88);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 30px;
    box-shadow: 0 15px 55px rgba(0,0,0,0.3);
    z-index: 20;
}
.caption-sentence {
    width: 100%;
    color: #ffffff;
    font-size: 43px;
    font-weight: 700;
    line-height: 1.9;
    text-align: center;
    direction: rtl;
    opacity: 0;
    visibility: hidden;
}
.caption-word {
    display: inline-block;
    margin: 0 5px;
    color: #ffffff;
    transition: color 0.15s ease;
}
.caption-word.active {
    color: #f6bd60;
}
.brand {
    position: absolute;
    top: 70px;
    left: 70px;
    color: rgba(255,255,255,0.55);
    font-family: Arial, sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    z-index: 30;
}
.bottom-line {
    position: absolute;
    bottom: 115px;
    left: 90px;
    right: 90px;
    height: 3px;
    background: rgba(255,255,255,0.12);
    z-index: 25;
}
.bottom-line::after {
    content: "";
    display: block;
    width: 35%;
    height: 3px;
    background: #48c6ef;
}
</style>
</head>
<body>
<div
    id="root"
    data-composition-id="stage1"
    data-start="0"
    data-duration="__DURATION__"
    data-width="1080"
    data-height="1920"
>
<div class="brand">NFP STORY STUDIO</div>
<div id="scene-container">
    __SCENES_HTML__
</div>
<div id="caption-area" class="caption-area"></div>
<div class="bottom-line"></div>
<audio
    id="narration"
    data-start="0"
    data-duration="__DURATION__"
    data-track-index="10"
    src="narration.wav"
    preload="auto"
></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const STORY_TIMING = __TIMELINE_JSON__;
const timeline = gsap.timeline({
    paused: true
});
const scenes = STORY_TIMING.sentences || [];
const captionArea = document.getElementById("caption-area");
const sceneElements = document.querySelectorAll(".scene");
gsap.set(sceneElements, {
    autoAlpha: 0,
    scale: 0.97
});
function createCaption(sentence) {
    const container = document.createElement("div");
    container.className = "caption-sentence";
    container.dir = "rtl";
    const wordElements = [];
    (sentence.words || []).forEach((word, index) => {
        const span = document.createElement("span");
        span.className = "caption-word";
        span.textContent = word.text;
        container.appendChild(span);
        wordElements.push({
            element: span,
            start: Number(word.start),
            end: Number(word.end)
        });
    });
    captionArea.appendChild(container);
    return {
        container,
        wordElements
    };
}
scenes.forEach((sentence, index) => {
    const start = Number(sentence.start);
    const end = Number(sentence.end);
    const scene = document.getElementById(
        "sent-" + sentence.id
    );
    if (scene) {
        timeline.fromTo(
            scene,
            {
                autoAlpha: 0,
                scale: 0.97
            },
            {
                autoAlpha: 1,
                scale: 1,
                duration: 0.55,
                ease: "power2.out"
            },
            start
        );
        const nodes = scene.querySelectorAll(".node");
        nodes.forEach((node, nodeIndex) => {
            timeline.fromTo(
                node,
                {
                    scale: 0,
                    opacity: 0
                },
                {
                    scale: 1,
                    opacity: 1,
                    duration: 0.35,
                    ease: "back.out(1.7)"
                },
                start + 0.3 + nodeIndex * 0.18
            );
        });
        if (end - start > 0.4) {
            timeline.to(
                scene,
                {
                    autoAlpha: 0,
                    duration: 0.35,
                    ease: "power1.in"
                },
                Math.max(start + 0.55, end - 0.35)
            );
        }
    }
    const caption = createCaption(sentence);
    timeline.fromTo(
        caption.container,
        {
            autoAlpha: 0,
            y: 25
        },
        {
            autoAlpha: 1,
            y: 0,
            duration: 0.25,
            ease: "power2.out"
        },
        start
    );
    timeline.to(
        caption.container,
        {
            autoAlpha: 0,
            y: -12,
            duration: 0.2
        },
        Math.max(start, end - 0.2)
    );
    caption.wordElements.forEach(word => {
        timeline.set(
            word.element,
            {
                color: "#f6bd60"
            },
            word.start
        );
        timeline.set(
            word.element,
            {
                color: "#ffffff"
            },
            word.end
        );
    });
});
window.__timelines.stage1 = timeline;
</script>
</body>
</html>
