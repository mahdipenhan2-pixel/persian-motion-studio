<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFP Story Studio - Stage 1</title>

<style>
@font-face {
    font-family: "Vazirmatn";
    src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: "Vazirmatn";
    src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
}

:root {
    --ink: #07111f;
    --paper: #eef2f7;
    --muted: #8aa0b8;
    --cyan: #48c6ef;
    --gold: #f6bd60;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
}

body {
    font-family: "Vazirmatn", sans-serif;
}

#root {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            #17365b 0%,
            transparent 40%
        ),
        radial-gradient(
            circle at 85% 75%,
            #153d45 0%,
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #07111f,
            #101d32 55%,
            #07111f
        );

    color: var(--paper);
}

#scene-container {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.scene {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    opacity: 0;
    overflow: hidden;
}

.scene::before,
.scene::after {
    content: "";
    position: absolute;
    border: 2px solid rgba(72,198,239,0.12);
    border-radius: 50%;
    pointer-events: none;
}

.scene::before {
    width: 850px;
    height: 850px;
    top: 350px;
    left: 115px;
}

.scene::after {
    width: 620px;
    height: 620px;
    top: 465px;
    left: 230px;
}

.node {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 25px rgba(72,198,239,0.7);
}

.stage1-node-1 {
    background: var(--gold);
    box-shadow: 0 0 25px rgba(246,189,96,0.7);
}

.stage1-node-2 {
    background: #80ed99;
    box-shadow: 0 0 25px rgba(128,237,153,0.7);
}

.brand {
    position: absolute;
    top: 70px;
    left: 70px;
    color: rgba(255,255,255,0.55);
    font-family: Arial, sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    z-index: 10;
}

#caption-area {
    position: absolute;
    left: 70px;
    right: 70px;
    bottom: 230px;
    min-height: 230px;
    padding: 42px 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(5,13,26,0.90);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 30px;

    box-shadow: 0 15px 55px rgba(0,0,0,0.3);
    z-index: 20;
}

.caption-sentence {
    width: 100%;
    color: var(--paper);
    font-size: 43px;
    font-weight: 700;
    line-height: 1.9;
    text-align: center;
    direction: rtl;
    opacity: 0;
    visibility: hidden;
}

.caption-word {
    display: inline;
    color: var(--muted);
    margin-inline: 0.08em;
    border-radius: 0.2em;
}

.bottom-line {
    position: absolute;
    bottom: 115px;
    left: 90px;
    right: 90px;
    height: 3px;
    background: rgba(255,255,255,0.12);
    z-index: 10;
}

.bottom-line::after {
    content: "";
    display: block;
    width: 35%;
    height: 3px;
    background: var(--cyan);
}
</style>
</head>

<body>

<div
    id="root"
    data-composition-id="stage1"
    data-start="0"
    data-width="1080"
    data-height="1920"
>

    <audio
        id="narration"
        src="narration.wav"
        data-start="0"
        data-duration="__DURATION__"
        data-track-index="10"
        data-volume="1"
    ></audio>

    <div class="brand">
        NFP STORY STUDIO
    </div>

    <div id="scene-container">
        __SCENES_HTML__
    </div>

    <div id="caption-area"></div>

    <div class="bottom-line"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
(() => {
    "use strict";

    const DATA = __TIMELINE_JSON__;

    if (typeof gsap === "undefined") {
        throw new Error("GSAP failed to load.");
    }

    if (
        !DATA ||
        !Array.isArray(DATA.sentences)
    ) {
        throw new Error("Invalid Stage 1 timeline.");
    }

    const timeline = gsap.timeline({
        paused: true
    });

    const captionArea = document.getElementById(
        "caption-area"
    );

    DATA.sentences.forEach((sentence) => {

        const scene = document.getElementById(
            "sent-" + sentence.id
        );

        if (!scene) {
            throw new Error(
                "Scene missing: " + sentence.id
            );
        }

        const start = Number(sentence.start);
        const end = Number(sentence.end);
        const duration = end - start;

        if (
            !Number.isFinite(start) ||
            !Number.isFinite(end) ||
            start < 0 ||
            duration <= 0
        ) {
            throw new Error(
                "Invalid scene timing: " + sentence.id
            );
        }

        // Scene entrance starts exactly at clip start.

        timeline.fromTo(
            scene,
            {
                opacity: 0,
                scale: 0.97
            },
            {
                opacity: 1,
                scale: 1,
                duration: Math.min(0.35, duration),
                ease: "power2.out",
                immediateRender: false
            },
            start
        );

        // Create Persian caption.

        const caption = document.createElement("div");

        caption.className = "caption-sentence";
        caption.dir = "rtl";

        const words = [];

        sentence.words.forEach((word) => {

            const wordStart = Number(word.start);
            const wordEnd = Number(word.end);

            if (
                !Number.isFinite(wordStart) ||
                !Number.isFinite(wordEnd) ||
                wordStart < 0 ||
                wordEnd <= wordStart
            ) {
                throw new Error(
                    "Invalid word timing."
                );
            }

            const span = document.createElement("span");

            span.className = "caption-word";
            span.textContent = word.text;

            caption.appendChild(span);

            words.push({
                element: span,
                start: wordStart,
                end: wordEnd
            });
        });

        captionArea.appendChild(caption);

        // Caption entrance.

        timeline.fromTo(
            caption,
            {
                autoAlpha: 0,
                y: 20
            },
            {
                autoAlpha: 1,
                y: 0,
                duration: Math.min(0.25, duration),
                ease: "power2.out",
                immediateRender: false
            },
            start
        );

        // Word-by-word highlighting.

        words.forEach((word) => {

            timeline.set(
                word.element,
                {
                    color: "#f6bd60"
                },
                word.start
            );

            timeline.set(
                word.element,
                {
                    color: "#ffffff"
                },
                word.end
            );
        });

        // Fade out before the clip ends.

        const fadeOutDuration = Math.min(
            0.2,
            duration
        );

        const fadeOutStart = Math.max(
            start,
            end - fadeOutDuration
        );

        timeline.to(
            caption,
            {
                autoAlpha: 0,
                y: -12,
                duration: fadeOutDuration,
                ease: "power1.in"
            },
            fadeOutStart
        );

        timeline.to(
            scene,
            {
                opacity: 0,
                duration: fadeOutDuration,
                ease: "power1.in"
            },
            fadeOutStart
        );
    });

    // Register the composition timeline.

    window.__timelines = window.__timelines || {};

    window.__timelines["stage1"] = timeline;

})();
</script>

</body>
</html>
