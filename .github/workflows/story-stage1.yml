name: NFP Story Studio - Stage 1

on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: "Confirm Gemini usage is verified as free"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

concurrency:
  group: nfp-story-stage1
  cancel-in-progress: false

jobs:
  build-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      CONFIRM_FREE_TIER: ${{ inputs.confirm_free_tier }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig \
            python3-venv
          fc-cache -f

      - name: Create Python environment
        run: |
          python -m venv .venv-stage1
          .venv-stage1/bin/python -m pip install --upgrade pip
          .venv-stage1/bin/python -m pip install \
            faster-whisper==1.2.1 \
            "av<19"

      - name: Validate Stage 1 inputs
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py check

      # Restore previously generated Gemini narration.
      - name: Restore Stage 1 audio cache
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/story/stage1/audio
          key: stage1-audio-${{ hashFiles('story/script.stage1.json', 'story/config.stage1.json', 'scripts/story_stage1.py') }}
          restore-keys: |
            stage1-audio-

      # Restore Whisper model.
      - name: Restore Whisper model cache
        id: whisper-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: stage1-whisper-small-v1

      # Generate narration or reuse cached audio.
      - name: Generate Persian narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$CONFIRM_FREE_TIER" in
            true|TRUE|yes|YES)
              export CONFIRM_FREE_TIER=YES
              ;;
            *)
              export CONFIRM_FREE_TIER=NO
              ;;
          esac

          echo "Free-tier confirmation: $CONFIRM_FREE_TIER"

          .venv-stage1/bin/python scripts/story_stage1.py tts

      # Save narration for future runs.
      - name: Save Stage 1 audio cache
        if: steps.audio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/story/stage1/audio
          key: stage1-audio-${{ hashFiles('story/script.stage1.json', 'story/config.stage1.json', 'scripts/story_stage1.py') }}

      # Convert generated narration into the format Whisper expects.
      - name: Prepare audio
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py prepare

      # Generate word-level timestamps.
      - name: Generate Whisper timestamps
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py transcribe

      # Save downloaded Whisper model.
      - name: Save Whisper model cache
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: stage1-whisper-small-v1

      - name: Align Persian words
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py align

      - name: Compose Stage 1 scenes
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py compose

      - name: Render MP4 with HyperFrames
        working-directory: build/stage1/story
        run: |
          npx --yes hyperframes render \
            --output ../story.mp4 \
            --fps 30 \
            --quality standard

      - name: Verify final MP4
        run: |
          .venv-stage1/bin/python scripts/story_stage1.py verify

      # Upload available production files, even if a later step fails.
      - name: Upload Stage 1 production files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFP-Stage1-Production
          path: |
            build/stage1/story.mp4
            build/stage1/verify.json
            build/stage1/timing_report.md
            build/stage1/story.srt
            build/stage1/story/index.html
            build/stage1/whisper/transcript.json
          if-no-files-found: ignore
          retention-days: 7
