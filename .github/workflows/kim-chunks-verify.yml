name: Kim raw-chunk verify (restore only, no API, no save)

# Read-only check that the four raw Gemini chunks of kim-docu-6min c2/c3 are in the Actions cache.
# No secrets, no Gemini, no TTS, no cache save, no git push (it only reads). Starts only when this file itself is pushed to docu-16x9-test30.
on:
  push:
    branches: ["docu-16x9-test30"]
    paths: [".github/workflows/kim-chunks-verify.yml"]

permissions:
  contents: read

concurrency:
  group: kim-chunks-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v7

      # Same restore the audio workflow does (newest cache with the story-cache-v2- prefix). Read-only; a miss stops the job.
      - name: Restore the story cache exactly as the audio run would (read-only, never saves)
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: .cache/story
          key: story-cache-v2-none
          restore-keys: |
            story-cache-v2-
          fail-on-cache-miss: true

      - name: Show what was restored
        run: |
          echo "matched cache key: ${{ steps.restore.outputs.cache-matched-key }}"
          echo "files in .cache/story: $(find .cache/story -type f | wc -l)"
          ls -la .cache/story/chunks

      - name: Install numpy (system package, same as the audio workflow)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy

      - name: Verify the four raw chunks (existence, plan hash in the file name, WAV duration, SHA-256) - no key, no network call
        run: |
          set -e
          if env | grep -qi '^GEMINI'; then echo "ERROR: a GEMINI variable is present; refusing"; exit 1; fi
          python3 docu/engine/tts_chunks.py verify-raw --project kim-docu-6min --chapter c2 \
            --expect chunk-a783f8f3c4f0e2a1362733d2.wav:59.0 chunk-8af9150c5d10b64267dfb325.wav:18.6
          python3 docu/engine/tts_chunks.py verify-raw --project kim-docu-6min --chapter c3 \
            --expect chunk-60dd05d2dc2da3089544fd86.wav:57.4 chunk-fb61944be2563360277b03d3.wav:37.2
          echo "all four raw chunks present and consistent"

      - name: Rehearse the re-cut run in NO_API mode (no key at all; it must report 'every raw chunk is present')
        run: |
          set -e
          for C in c2 c3; do
            DOCU_NO_API=1 python3 docu/engine/tts_chunks.py generate --project kim-docu-6min --chapter "$C" --spacing 25 --max-requests 0 --attempts 1
          done
