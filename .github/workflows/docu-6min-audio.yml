name: Docu 6-min audio (narration + word timing, no render)

# Audio phase for the independent project docu/projects/kim-docu-6min (3 chapters).
# Starts ONLY when the marker file docu/projects/kim-docu-6min/AUDIO_RUN is pushed to the test branch (never from main).
# Cached sentences (the six approved ones whose text is unchanged) are reused; only new sentences use the Gemini FREE tier.
# Result: narration.wav + timing.json per chapter, published to the branch docu-6min-data (never to main).
on:
  push:
    branches: ["docu-16x9-test30"]
    paths: ["docu/projects/kim-docu-6min/AUDIO_RUN"]

permissions:
  contents: write

concurrency:
  group: docu-6min-audio
  cancel-in-progress: false

env:
  PROJECT: kim-docu-6min

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install FFmpeg and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-numpy

      - name: Tests (locked core and documentary layer, offline)
        run: |
          python3 scripts/test_stage2_alignment.py
          python3 docu/tests/test_docu.py

      - name: Show plan
        run: python3 docu/engine/run.py plan --project "$PROJECT" --chapter c1

      - name: Restore story cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/story
          key: story-cache-v2-none
          restore-keys: |
            story-cache-v2-

      - name: Count sentences that need the Gemini API (all chapters)
        id: check
        run: |
          TOTAL=0
          for C in c1 c2 c3; do
            export GITHUB_OUTPUT="$RUNNER_TEMP/out_$C.txt"; : > "$GITHUB_OUTPUT"
            python3 docu/engine/run.py check --project "$PROJECT" --chapter "$C"
            N=$(grep -oP '(?<=api_needed=)\d+' "$GITHUB_OUTPUT" || echo 0)
            echo "chapter $C needs $N API request(s)"
            TOTAL=$((TOTAL + N))
          done
          echo "api_needed=$TOTAL" >> "$GITHUB_STEP_SUMMARY" 
          echo "total_api_needed=$TOTAL"
          echo "TOTAL_API=$TOTAL" >> "$GITHUB_ENV"

      - name: Free-tier confirmation gate
        if: env.TOTAL_API != '0'
        env:
          CONFIRM: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
        run: |
          if [ "$CONFIRM" != "YES" ]; then
            echo "::error::Stopped before any Gemini request: repository variable GEMINI_FREE_TIER_CONFIRMED is not YES."
            exit 1
          fi

      - name: Generate narration (Gemini TTS free tier; cached sentences are skipped)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for C in c1 c2 c3; do
            python3 docu/engine/run.py tts --project "$PROJECT" --chapter "$C"
          done

      - name: Save story cache right away
        if: always()
        run: mkdir -p .cache/story; echo "KEY=story-cache-v2-$(find .cache/story -type f | sort | sha256sum | cut -c1-24)" >> "$GITHUB_ENV"; echo "COUNT=$(find .cache/story -type f | wc -l)" >> "$GITHUB_ENV"

      - uses: actions/cache/save@v5
        if: always() && env.COUNT != '0'
        with:
          path: .cache/story
          key: ${{ env.KEY }}

      - name: Prepare audio timelines
        run: |
          for C in c1 c2 c3; do
            python3 docu/engine/run.py prepare --project "$PROJECT" --chapter "$C"
            python3 docu/engine/run.py fit --project "$PROJECT" --chapter "$C" || true
          done

      - name: Restore Whisper model cache
        id: whisper-model
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-small-v1

      - name: Word timestamps (faster-whisper)
        run: |
          python3 -m venv .venv-whisper
          .venv-whisper/bin/pip install --upgrade pip
          .venv-whisper/bin/pip install faster-whisper==1.2.1 "av<19"
          for C in c1 c2 c3; do
            .venv-whisper/bin/python docu/engine/run.py whisper --project "$PROJECT" --chapter "$C"
          done

      - name: Save Whisper model cache
        if: steps.whisper-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-small-v1

      - name: Align script words to speech
        run: |
          for C in c1 c2 c3; do
            python3 docu/engine/run.py align --project "$PROJECT" --chapter "$C"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docu-6min-audio
          path: |
            build/docu/kim-docu-6min/*/narration.wav
            build/docu/kim-docu-6min/*/timing.json
            build/docu/kim-docu-6min/*/timing_report.md
            build/docu/kim-docu-6min/*/tts_meta.json
            build/docu/kim-docu-6min/*/audio_meta.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish narration + timing to branch docu-6min-data (not main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/data"; rm -rf "$OUT"; mkdir -p "$OUT"
          for C in c1 c2 c3; do
            B="build/docu/$PROJECT/$C"; mkdir -p "$OUT/$C"
            for F in narration.wav timing.json timing_report.md tts_meta.json audio_meta.json; do [ -f "$B/$F" ] && cp "$B/$F" "$OUT/$C/$F"; done
          done
          cd "$OUT"
          git init -q -b docu-6min-data
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -q -m "docu-6min narration and timing (generated by the audio workflow)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin docu-6min-data
          ls -la "$OUT"/*
