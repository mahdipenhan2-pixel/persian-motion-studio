name: Docu finalize cine (post-render steps on the existing render; no render, no Gemini)

# Takes the 1080p master that run 44965964238 already rendered (artifact docu-kim-test30-cine-c1), then runs exactly the
# steps that follow the render in docu-build.yml: verify master, make the 1280x720 story.mp4, verify the delivered 720p file.
on:
  push:
    branches: ["docu-16x9-test30"]
    paths: [".github/workflows/docu-finalize-cine.yml"]

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN: "44965964238"
      PROJECT: kim-test30-cine
      CHAPTER: c1
      NO_NEW_TTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Download the rendered master (no new render, no API)
        uses: actions/download-artifact@v7
        with:
          name: docu-kim-test30-cine-c1
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/docu/kim-test30-cine/c1
      - name: Install ffmpeg and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil
          ls -la build/docu/kim-test30-cine/c1 | head -20
      - name: Verify the 1080p master (same code as the build workflow)
        env:
          VERIFY_FILE: story.mp4
          VERIFY_SIZE: 1920x1080
          VERIFY_TAG: _master
        run: python3 docu/engine/run.py verify --project "$PROJECT" --chapter "$CHAPTER"

      - name: Make the 720p deliverable (story.mp4 = 1280x720, 16:9, 30 fps)
        run: |
          B="build/docu/$PROJECT/$CHAPTER"
          mv "$B/story.mp4" "$B/story_1080p_master.mp4"
          ffmpeg -y -v error -i "$B/story_1080p_master.mp4" \
            -vf "scale=1280:720:flags=lanczos,format=yuv420p" -r 30 \
            -c:v libx264 -preset slow -crf 20 -c:a copy -movflags +faststart "$B/story.mp4"
          python3 - <<'PY'
          import json, os, subprocess, sys
          B = f"build/docu/{os.environ['PROJECT']}/{os.environ['CHAPTER']}"
          def probe(f):
              return json.loads(subprocess.run(["ffprobe", "-v", "error", "-print_format", "json", "-show_streams", "-show_format", f], capture_output=True, check=True, text=True).stdout)
          m, o = probe(f"{B}/story_1080p_master.mp4"), probe(f"{B}/story.mp4")
          v = next(s for s in o["streams"] if s["codec_type"] == "video"); a = [s for s in o["streams"] if s["codec_type"] == "audio"]
          dm, do = float(m["format"]["duration"]), float(o["format"]["duration"])
          res = {"file": "story.mp4", "width": v["width"], "height": v["height"], "fps": v["r_frame_rate"], "codec": v["codec_name"],
                 "sample_aspect_ratio": v.get("sample_aspect_ratio"), "duration": round(do, 3), "master_duration": round(dm, 3),
                 "audio": [a[0]["codec_name"]] if a else [], "size_bytes": int(o["format"]["size"]), "problems": []}
          if (v["width"], v["height"]) != (1280, 720): res["problems"].append(f"resolution {v['width']}x{v['height']}, expected exactly 1280x720")
          if v["r_frame_rate"] != "30/1": res["problems"].append(f"fps {v['r_frame_rate']}, expected 30/1")
          if not a: res["problems"].append("no audio stream")
          if abs(do - dm) > 0.1: res["problems"].append(f"duration {do:.2f}s differs from master {dm:.2f}s")
          json.dump(res, open(f"{B}/final_720p.json", "w"), indent=2); print(json.dumps(res, indent=2))
          if res["problems"]: sys.exit("720p CHECK FAILED: " + "; ".join(res["problems"]))
          print("720p CHECK OK")
          PY

      - name: Verify the delivered 720p story.mp4 (same checks, measured on the final file)
        env:
          VERIFY_FILE: story.mp4
          VERIFY_SIZE: 1280x720
          VERIFY_TAG: ""
        run: python3 docu/engine/run.py verify --project "$PROJECT" --chapter "$CHAPTER"

      - name: Add report to workflow summary
        if: always()
        run: |
          B="build/docu/$PROJECT/$CHAPTER"
          for f in verify_master.json verify.json final_720p.json; do
            [ -f "$B/$f" ] && { echo; echo "### $f"; echo '```json'; cat "$B/$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload results (final 720p story.mp4 + reports)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docu-kim-test30-cine-c1-final
          path: |
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/story.mp4
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/story.srt
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/contact_sheet.png
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/timing.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/timing_report.md
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/verify.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/verify_master.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/final_720p.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/tts_meta.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/audio_meta.json
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/narration.wav
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/frames/
            build/docu/${{ env.PROJECT }}/${{ env.CHAPTER }}/story/index.html
          if-no-files-found: warn
          retention-days: 30
