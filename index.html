<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pipeline test</title>
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Vazirmatn";
    src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2");
    font-weight: 700;
  }
  :root {
    --ink: #0e1a2b;
    --paper: #eef2f7;
    --muted: #8aa0b8;
    --sea: #4fd1c5;
  }
  body { margin: 0; background: var(--ink); }
  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--ink);
    font-family: "Vazirmatn", "Noto Sans Arabic", sans-serif;
    color: var(--paper);
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }
  #title { font-size: 190px; font-weight: 700; line-height: 1.1; margin: 0; }
  #sub { font-size: 56px; font-weight: 400; color: var(--muted); margin: 0; }
  #rule {
    width: 760px;
    height: 6px;
    background: var(--sea);
    transform-origin: right center;
  }
  #tags { display: flex; gap: 28px; margin-top: 24px; }
  .tag {
    font-size: 46px;
    font-weight: 700;
    padding: 12px 34px;
    border: 3px solid var(--sea);
    border-radius: 999px;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="5">
  <section id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1">
    <h1 id="title">افغانستان</h1>
    <div id="rule"></div>
    <p id="sub">کشوری بدون راه به دریا</p>
    <div id="tags">
      <span class="tag">کابل</span>
      <span class="tag">هرات</span>
      <span class="tag">قندهار</span>
      <span class="tag">مزار شریف</span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from("#title", { opacity: 0, y: 50, duration: 0.8, ease: "power3.out" }, 0.2);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 0.9);
  tl.from("#sub", { opacity: 0, y: 30, duration: 0.7, ease: "power3.out" }, 1.1);
  tl.from(".tag", { opacity: 0, y: 24, duration: 0.5, ease: "power3.out", stagger: 0.35 }, 1.8);
  tl.to("#stage", { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.4);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
